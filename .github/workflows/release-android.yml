name: Build & Release APK / AAB

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Flutter Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore Keystore & key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > mobile/android/app/upload-keystore.jks
          fi
          if [ -n "$KEY_PROPERTIES" ]; then
            echo "$KEY_PROPERTIES" > mobile/android/key.properties
          fi

      - name: Install Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Release APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Build Release App Bundle (AAB)
        run: |
          cd mobile
          flutter build appbundle --release

      - name: Automatically Create/Update GitHub Release & Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AV-Raffle ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
