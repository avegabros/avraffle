version: '3.8'

services:
  raffle-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: avegabros/avraffle:latest
    container_name: avraffle-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/dev.db
      - NEXTAUTH_SECRET=raffle_secret_change_me_in_production
    volumes:
      # Persistent volume for SQLite DB and uploaded photos
      - raffle-data:/app/data
      - raffle-uploads:/app/public/uploads

volumes:
  raffle-data:
  raffle-uploads:
