version: '3.8'

services:
  raffle-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: avegabros/avraffle:latest
    container_name: avraffle-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/raffle.db
      - NEXTAUTH_SECRET=avega_raffle_prod_secret_change_me
    volumes:
      # Persistent SQLite database and attendee mugshots
      - raffle-data:/app/data
      - raffle-uploads:/app/public/uploads

volumes:
  raffle-data:
    driver: local
  raffle-uploads:
    driver: local
